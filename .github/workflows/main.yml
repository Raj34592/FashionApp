name: Build Offline AI App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Clean Android Project
      run: |
        mkdir -p app/src/main/java/com/offline/app
        
        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "OfflineAIApp"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins { id 'com.android.application' version '8.1.0' apply false }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.offline.app'
            compileSdk 34
            defaultConfig { applicationId "com.offline.app"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Offline AI">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/offline/app/MainActivity.java
        package com.offline.app;
        import android.app.Activity;
        import android.os.Bundle;
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); }
        }
        EOF

        gradle wrapper --gradle-version 8.4

    - name: Build APK File
      run: ./gradlew assembleDebug

    - name: Upload Complete APK
      uses: actions/upload-artifact@v4
      with:
        name: Offline-AI-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
