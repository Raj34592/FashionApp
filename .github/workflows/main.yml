name: Build FashionApp APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/example/fashionapp
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        
        # Move your uploaded files to correct Android folders
        mv MainActivity.java app/src/main/java/com/example/fashionapp/ 2>/dev/null || true
        mv activity_main.xml app/src/main/res/layout/ 2>/dev/null || true

        # Create AndroidManifest.xml
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.fashionapp">
            <application android:allowBackup="true" android:label="FashionApp" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Create styles.xml
        cat <<EOF > app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.AppCompat.Light.NoActionBar" parent="android:Theme.Light.NoTitleBar" />
        </resources>
        EOF

        # Create Gradle build files
        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.example.fashionapp'
            compileSdk 33
            defaultConfig {
                applicationId "com.example.fashionapp"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        echo "include ':app'" > settings.gradle

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.0.0' }
        }
        EOF
        
        gradle wrapper

    - name: Build APK File
      run: ./gradlew assembleDebug

    - name: Upload APK for Download
      uses: actions/upload-artifact@v4
      with:
        name: FashionApp-APK
        path: app/build/outputs/apk/debug/app-debug.apk
